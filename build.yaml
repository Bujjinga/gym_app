targets:
  $default:
    builders:
      drift_dev:
        options:
          # ISO-8601 text dates sort correctly and map 1:1 to Supabase timestamptz.
          store_date_time_values_as_text: true
          named_parameters: true
      json_serializable:
        options:
          explicit_to_json: true
          include_if_null: false
